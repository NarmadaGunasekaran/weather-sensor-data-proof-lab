<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather Compression — Video Story</title>
    <style>
      :root{--navy:#061b30;--blue:#65bbff;--green:#76e7b3;--text:#eaf5ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#020b15;color:var(--text);font-family:Inter,system-ui,sans-serif}.film{width:min(980px,calc(100% - 28px));padding:35px;border:1px solid #27547a;border-radius:25px;background:linear-gradient(140deg,#0d3555,#061526);box-shadow:0 30px 80px #000}.eyebrow{color:var(--blue);font-size:.78rem;font-weight:800;letter-spacing:.1em}h1{font-size:clamp(2rem,5vw,4rem);letter-spacing:-.06em;margin:10px 0}.subtitle{max-width:700px;line-height:1.55;color:#bbd4e7}.stage{height:300px;position:relative;margin:28px 0;overflow:hidden;border-radius:17px;background:#092641}.cloud{position:absolute;width:170px;height:65px;border-radius:80px;background:#c9e8ff;opacity:.85;animation:float 8s ease-in-out infinite}.cloud::before,.cloud::after{content:"";position:absolute;background:#c9e8ff;border-radius:50%}.cloud::before{width:80px;height:80px;left:26px;top:-37px}.cloud::after{width:105px;height:105px;right:19px;top:-56px}.cloud.one{left:9%;top:44px}.cloud.two{right:8%;top:165px;animation-delay:-4s}.rain{position:absolute;inset:105px 0 0;background:repeating-linear-gradient(105deg,transparent 0 34px,rgba(102,196,255,.75) 35px 38px,transparent 39px 70px);animation:rain 1s linear infinite}.packet{position:absolute;left:10%;bottom:40px;padding:15px 20px;border:2px solid var(--blue);border-radius:10px;background:#0b365c;font-weight:800;animation:packet 8s linear infinite}.packet b{color:var(--green)}.caption{min-height:70px;padding:16px;border-left:4px solid var(--green);background:#0b2942;font-size:1.08rem;line-height:1.5}audio{width:100%;margin-top:18px}@keyframes float{50%{transform:translateY(-12px)}}@keyframes rain{to{background-position:0 28px}}@keyframes packet{0%,25%{left:10%}50%,100%{left:66%}}@media(max-width:600px){.film{padding:22px}.stage{height:240px}}
    </style></head>
  <body><main class="film"><div class="eyebrow">NARRATED PROJECT STORY</div><h1>Can weather data become smaller—without losing anything?</h1><p class="subtitle">This short story shows the project’s upload, comparison, exact-recovery, drift, and safe-error checks.</p><section class="stage"><div class="cloud one"></div><div class="cloud two"></div><div class="rain"></div><div class="packet">Weather packet → <b>lossless proof</b></div></section><div id="caption" class="caption">Press play. The captions will guide you through the story.</div><audio id="story" controls preload="metadata"><source src="pilot-demo-narration.wav" type="audio/wav"></audio></main><script>const a=document.getElementById('story'),c=document.getElementById('caption');const captions=[[0,'Welcome: this is a Weather Sensor Data Proof Lab using synthetic weather data.'],[22,'Step 1: weather readings are compressed, decoded, and compared byte for byte.'],[57,'Step 2: the weather-aware method is compared with standard GZIP on the same data.'],[93,'Step 3: weather patterns change. The tool detects drift and recommends investigation.'],[121,'Step 4: a damaged packet is rejected safely by its checksum.'],[143,'Final result: measured savings, exact reconstruction, safe error handling, and an evidence report.']];let last=-1;a.addEventListener('timeupdate',()=>{const i=captions.reduce((best,item,index)=>a.currentTime>=item[0]?index:best,-1);if(i!==last){last=i;c.textContent=captions[i]?.[1]||c.textContent}});</script></body>
</html>
